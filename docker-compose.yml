services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: parky-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${SQL_SA_PASSWORD:?SQL_SA_PASSWORD is required}"
    ports:
      - "1433:1433"
    volumes:
      - parky-sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/1433'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: parky-redis
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
    ports:
      - "6379:6379"
    volumes:
      - parky-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Parky.API/Dockerfile
    image: parky-api:1.0
    container_name: parky-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=ParkyDB;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True"
      Jwt__Issuer: "Parky.API"
      Jwt__Audience: "Parky.Client"
      Jwt__SecretKey: "${JWT_SECRET_KEY}"
      Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD},abortConnect=false,connectRetry=10,connectTimeout=5000,syncTimeout=5000"
      Redis__InstanceName: "Parky:"
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    working_dir: /src
    volumes:
      - ./:/src
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=ParkyDB;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True"
      Jwt__Issuer: "Parky.API"
      Jwt__Audience: "Parky.Client"
      Jwt__SecretKey: "${JWT_SECRET_KEY}"
      Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD},abortConnect=false,connectRetry=10,connectTimeout=5000,syncTimeout=5000"
      Redis__InstanceName: "Parky:"
    entrypoint: ["/bin/bash", "-lc"]
    command: >
      dotnet tool install --tool-path /tmp/dotnet-tools dotnet-ef --version 8.0.0 &&
      /tmp/dotnet-tools/dotnet-ef database update
      --project Parky.Infrastructure/Parky.Infrastructure.csproj
      --startup-project Parky.API/Parky.API.csproj
      --context ParkyDbContext
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - tools

volumes:
  parky-sqlserver-data:
  parky-redis-data:
    external: true
    name: parky-redis-data
